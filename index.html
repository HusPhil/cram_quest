<!doctype html>
<html lang="en">
  <head>
   
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/cramquest.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 1. The Meta Refresh Redirect (Triggers in 0 seconds) -->
    <meta http-equiv="refresh" content="0;url=https://cramquest.onrender.com">

    <meta property="og:title" content="CramQuest - Gamify your Tasks!" />
    <meta property="og:description" content="Gamify your tasks and boost your productivity with CramQuest." />
    <meta property="og:image"
        content="https://cramquest.onrender.com/assets/images/docs/thumbnail.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://cramquest.onrender.com" />
    <meta property="og:type" content="website" />

    <script>
      // Tiny iOS check
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        // Replace or update the viewport meta
        const meta = document.querySelector('meta[name="viewport"]');
        if (meta) {
          meta.setAttribute(
            'content',
            'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0'
          );
        }
      }
    </script>

    <title>CramQuest - Gamify Your Tasks</title>

    <script>
      (function(l) {
        const params = new URLSearchParams(l.search);
        const redirect = params.get("redirect");
        if (redirect) {
          window.history.replaceState(
            null,
            null,
            l.pathname.replace(/index\.html$/, "") + decodeURIComponent(redirect)
          );
        }
      })(window.location);
    </script>


  </head>
  <body>
    <div id="root" class="overflow-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 👈 gives Actions permission to push to gh-pages

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Debug env vars
        run: |
          echo "API_URL=$VITE_API_URL"
          echo "API_KEY_HEADER_NAME=$VITE_API_KEY_HEADER_NAME"
        env:
          VITE_API_KEY_HEADER_NAME: ${{ secrets.VITE_API_KEY_HEADER_NAME }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Build with secrets
        run: npm run build
        env:
          VITE_API_KEY_HEADER_NAME: ${{ secrets.VITE_API_KEY_HEADER_NAME }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: cramquest.husphil.space   

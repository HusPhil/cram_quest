<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      (function() {
        var l = window.location;

        // Detect if running on github.io and has a repo subfolder
        var isGitHubPages = /\.github\.io$/.test(l.hostname);
        var pathSegmentsToKeep = isGitHubPages ? 1 : 0; // repo-name vs root domain

        var base =
          l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "");
        var basePath = l.pathname
          .split("/")
          .slice(0, pathSegmentsToKeep + 1)
          .join("/");

        var extraPath = l.pathname
          .split("/")
          .slice(pathSegmentsToKeep + 1)
          .join("/");

        var newUrl =
          base +
          basePath +
          "/index.html?redirect=" +
          encodeURIComponent(extraPath + l.search + l.hash);

        window.location.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
